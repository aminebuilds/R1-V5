<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Jarvis — R.1</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="strip" role="banner">
    <span class="id">R.1 <b>/</b> Jarvis</span>
    <span id="home" class="hide-sm">—</span>
    <span id="clock"></span>
    <span id="session"></span>
    <span class="grow"></span>
    <span id="health" class="health"></span>
    <span id="updated" class="hide-sm"></span>
    <button type="button" id="notify" aria-pressed="false" title="Desktop notification when a new act-level item appears">Alerts off</button>
    <button type="button" id="refresh">Refresh</button>
    <a href="/" class="hide-sm" title="Open the globe console">Globe</a>
  </div>
  <main id="app" aria-live="polite"></main>
  <script type="module" src="/src/jarvis/app.js"></script>
</body>
</html>
