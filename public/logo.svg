<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="logo-title">
  <title id="logo-title">R.1 Commercial Intelligence</title>
  <defs>
    <linearGradient id="r1-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
    <linearGradient id="r1-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0a84ff" />
    </linearGradient>
  </defs>

  <!-- Outer Precision Hex Diamond Frame -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" 
           fill="none" 
           stroke="rgba(255,255,255,0.22)" 
           stroke-width="2.5" 
           stroke-linejoin="round" />

  <!-- Inner Tech Facet Accents -->
  <line x1="50" y1="6" x2="50" y2="18" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  <line x1="88" y1="28" x2="78" y2="34" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  <line x1="88" y1="72" x2="78" y2="66" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  <line x1="50" y1="94" x2="50" y2="82" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  <line x1="12" y1="72" x2="22" y2="66" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  <line x1="12" y1="28" x2="22" y2="34" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />

  <!-- Geometric "R" Monogram Architecture -->
  <!-- Vertical Stem -->
  <path d="M34,26 L34,74" 
        stroke="url(#r1-grad-primary)" 
        stroke-width="7" 
        stroke-linecap="round" />

  <!-- Upper Loop -->
  <path d="M34,26 L56,26 C66,26 72,32 72,42 C72,52 65,56 55,56 L34,56" 
        fill="none" 
        stroke="url(#r1-grad-primary)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Diagonal Power Leg with Accent -->
  <path d="M52,54 L69,74" 
        stroke="url(#r1-grad-accent)" 
        stroke-width="7" 
        stroke-linecap="round" />

  <!-- Active Telemetry Node Pip -->
  <circle cx="70" cy="74" r="3.5" fill="#38bdf8" />
</svg>
